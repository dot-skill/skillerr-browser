<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <style>
    /* Narration for window recordings: neutral glass, big type. Drawn above everything, never clickable. */
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; pointer-events: none;
      font: 650 34px/1.25 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; align-items: center; justify-content: center; padding: 8px; box-sizing: border-box; }
    .cap { max-width: 100%; padding: 18px 34px; border-radius: 22px; color: #fff; text-align: center; letter-spacing: -.015em;
      background: rgba(12, 12, 16, .88); box-shadow: 0 14px 44px rgba(0, 0, 0, .45), inset 0 0 0 1px rgba(255, 255, 255, .12);
      opacity: 0; transform: translateY(14px) scale(.98); transition: opacity .35s, transform .45s cubic-bezier(.2, .8, .2, 1); }
    .cap.on { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <div class="cap" id="cap"></div>
  <script src="caption.js"></script>
</body>
</html>
