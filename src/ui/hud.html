<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <style>
    @property --spin { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
    :root {
      --aurora: #8b6cff, #3de0c0, #ff7ac6, #8b6cff;
      --bg: rgba(20, 20, 26, .94); --text: #ededf2; --text-2: #a4a4b2; --line: rgba(255,255,255,.14);
      --warn: #fbbf24; --ok: #34d399; --danger: #fb7185;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: rgba(255,255,255,.96); --text: #15161c; --text-2: #5a5d6b; --line: rgba(15,18,30,.14); --warn: #d97706; }
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; -webkit-font-smoothing: antialiased; }
    body { display: flex; align-items: center; justify-content: center; padding: 6px; box-sizing: border-box; }
    button { font: inherit; cursor: pointer; border: 0; }
    .ring { padding: 1.5px; border-radius: 20px; background: conic-gradient(from var(--spin), var(--aurora)); animation: spin 3s linear infinite;
      box-shadow: 0 10px 34px rgba(0,0,0,.35), 0 0 22px rgba(139,108,255,.3); max-width: 100%; animation-name: spin, enter; animation-duration: 3s, .35s;
      animation-timing-function: linear, cubic-bezier(.2,.8,.2,1); animation-iteration-count: infinite, 1; }
    .ring.paused { background: var(--warn); box-shadow: 0 10px 34px rgba(0,0,0,.3); }
    .ring.ask { background: var(--warn); animation: attention 1.2s ease-in-out infinite; }
    .pill { display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 8px 0 12px; border-radius: 19px; background: var(--bg); color: var(--text); min-width: 0; }
    .orb { width: 24px; height: 24px; flex: none; background: conic-gradient(from var(--spin), var(--aurora)); animation: spin 1.6s linear infinite;
      -webkit-mask: url(mark.svg) center / contain no-repeat; mask: url(mark.svg) center / contain no-repeat; }
    .paused .orb, .ask .orb { background: var(--warn); animation: none; }
    .txt { min-width: 0; flex: 1; }
    .name { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .step { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
    .btns { display: flex; gap: 6px; flex: none; }
    .b { height: 34px; padding: 0 14px; border-radius: 12px; font-weight: 600; font-size: 12.5px; color: var(--text); background: rgba(127,127,140,.16); display: flex; align-items: center; gap: 6px; }
    .b:hover { background: rgba(127,127,140,.26); }
    .b.allow { background: var(--ok); color: #05150e; }
    .b.resume { background: var(--warn); color: #1c1402; }
    .b svg { display: block; }
    @keyframes spin { to { --spin: 360deg; } }
    @keyframes enter { from { opacity: 0; transform: translateY(10px) scale(.97); } }
    @keyframes attention { 50% { box-shadow: 0 10px 34px rgba(0,0,0,.35), 0 0 26px rgba(251,191,36,.55); } }
  </style>
</head>
<body>
  <div class="ring" id="ring">
    <div class="pill">
      <div class="orb"></div>
      <div class="txt"><div class="name" id="name"></div><div class="step" id="step"></div></div>
      <div class="btns" id="btns"></div>
    </div>
  </div>
  <script src="shared.js"></script>
  <script src="hud.js"></script>
</body>
</html>
