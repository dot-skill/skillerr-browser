# Checks every pull request and every push to main and develop: syntax, unit tests and the production bundle,
# on macOS, Windows and Linux. Nothing is built for release here; see deploy.yml.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # unit tests run in plain Node
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in src/*.js src/ui/*.js mcp/*.js mcp/preview/*.js scripts/*.js scripts/*.mjs test/*.js electron-builder.config.cjs; do node --check "$f"; done
      - name: Unit tests
        run: npm test
      - name: Production bundle
        run: npm run build
