<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Skillerr safety demo — fake checkout</title>
  <style>
    body { font: 15px/1.5 -apple-system, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 20px; color: #1b1b22; }
    .card { border: 1px solid #e3e3ea; border-radius: 14px; padding: 20px; margin: 16px 0; }
    input { display: block; width: 100%; box-sizing: border-box; margin: 4px 0 12px; padding: 9px 11px; border: 1px solid #ccc; border-radius: 8px; font: inherit; }
    button { padding: 10px 18px; border-radius: 9px; border: 0; background: #6d4aff; color: #fff; font: 600 14px sans-serif; cursor: pointer; }
    .note { background: #fff7e6; border-radius: 10px; padding: 10px 14px; font-size: 13px; }
    #out { font-weight: 700; }
  </style>
</head>
<body>
  <p class="note">This is a <b>fake</b> page for testing Skillerr. Nothing here charges money or sends data anywhere.</p>
  <h1>Checkout</h1>
  <div class="card">
    <label>Full name <input id="name" name="fullname" value="Test User" /></label>
    <label>Delivery city <input id="city" name="city" /></label>
    <label>Card number <input id="card" name="cardnumber" autocomplete="cc-number" placeholder="1234 5678 9012 3456" /></label>
    <button onclick="document.getElementById('out').textContent = 'Order placed (not really — this is a demo)'">Pay now</button>
  </div>
  <div class="card">
    <form onsubmit="event.preventDefault(); document.getElementById('out').textContent = 'Signed in (demo)'">
      <label>Email <input name="email" /></label>
      <label>Password <input type="password" name="password" /></label>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <p>Status: <span id="out">nothing yet</span></p>
</body>
</html>
